<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформлення замовлення - TechShop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc; 
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* 1. ГОЛОВНИЙ МАКЕТ СТОРІНКИ (Згідно з лекцією) */
        .page-layout {
            display: grid;
            /* Перша колонка (сайдбар) - 250px, друга (контент) - бере решту місця (1fr) */
            grid-template-columns: 250px 1fr;
            gap: 2rem;
            padding: 2rem 5%;
            flex: 1;
        }

        /* 2. ОФОРМЛЕННЯ БЛОКУ ФІЛЬТРІВ */
        .sidebar {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            height: max-content; 
        }

        .sidebar h3 {
            margin-bottom: 15px;
            color: #1e293b;
        }

        .sidebar ul {
            list-style-type: none;
        }

        .sidebar li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
        }

        /* КАТАЛОГ ТОВАРІВ */
        .products-content h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        /* 3. ОНОВЛЕННЯ СІТКИ КАРТОК (Згідно з лекцією) */
        .products-grid {
            display: grid;
            /* Магічна формула: Автоматично розставляй картки з мінімальною шириною 280px та розтягуй до 1fr */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem; /* Відступ від товарів до форми */
        }

        .product-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 1.1rem;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .product-card p {
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* КОНТЕЙНЕР ФОРМИ */
        .checkout-container {
            grid-column: 1 / -1; /* Форма розтягнеться на всю ширину знизу під колонками */
            width: 100%;
        }

        .checkout-container h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .checkout-form {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        fieldset {
            border: 1px solid #e5e7eb;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 6px;
        }

        legend {
            font-weight: bold;
            color: #1e293b;
            padding: 0 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.2rem;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #475569;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.6rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
        }

        .form-radio, .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.8rem;
            cursor: pointer;
        }

        .form-radio input, .form-checkbox input {
            width: auto;
            cursor: pointer;
        }

        .form-group input:invalid:focus,
        .form-group textarea:invalid:focus,
        .form-group select:invalid:focus {
            border-color: #ef4444;
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-group input:valid:not(:placeholder-shown),
        .form-group textarea:valid:not(:placeholder-shown) {
            border-color: #10b981; 
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        footer {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            text-align: center;
            margin-top: 40px;
        }

        /* 4. АДАТИВНИЙ ДИЗАЙН (Згідно з лекцією) */
        @media screen and (max-width: 768px) {
            .page-layout {
                /* Перемикаємо на один стовпець: сайдбар і контент будуть один під одним */
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Мій Логотип</h1>
        <nav>
            <a href="index.html">Головна</a>
            <a href="#">Про нас</a>
            <a href="checkout.html">Оформлення замовлення</a>
        </nav>
    </header>

    <!-- Головна обгортка з потрібним класом .page-layout -->
    <main class="page-layout">
        
        <!-- Блок фільтрів у aside -->
        <aside class="sidebar">
            <h3>Фільтри</h3>
            <ul>
                <li><input type="checkbox" /> Ноутбуки</li>
                <li><input type="checkbox" /> Смартфони</li>
            </ul>
        </aside>

        <!-- Основний контент магазину -->
        <section class="products-content">
            <h2>Популярні товари</h2>
            <div class="products-grid">
                
                <!-- Картки товарів у семантичному тегу <article> -->
                <article class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Товар 1" />
                    <h3>Ноутбук XYZ</h3>
                    <p>15 000 грн</p>
                    <button class="btn btn-primary">Додати до кошика</button>
                </article>

                <article class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Товар 2" />
                    <h3>Смартфон ABC</h3>
                    <p>8 000 грн</p>
                    <button class="btn btn-primary">Додати до кошика</button>
                </article>
                
            </div>
        </section>

        <!-- Форма замовлення під ними -->
        <div class="checkout-container">
            <h2>Оформлення замовлення</h2>
            
            <form action="#" method="POST" class="checkout-form">
                <fieldset>
                    <legend>1. Особисті дані</legend>
                    <div class="form-group">
                        <label for="fullName">ПІБ:</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Іванов Іван Іванович" />
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="example@mail.com" />
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone" pattern="[\+]\d{2}\d{10}" placeholder="+380991234567" required title="Формат: +380XXXXXXXXX" />
                    </div>
                </fieldset>

                <fieldset>
                    <legend>2. Спосіб доставки</legend>
                    <div class="form-radio">
                        <input type="radio" id="deliveryNova" name="delivery" value="nova_poshta" checked />
                        <label for="deliveryNova">Нова Пошта</label>
                    </div>
                    <div class="form-radio">
                        <input type="radio" id="deliveryCourier" name="delivery" value="courier" />
                        <label for="deliveryCourier">Кур'єр за адресою</label>
                    </div>
                    <div class="form-group">
                        <label for="city">Місто:</label>
                        <select id="city" name="city">
                            <option value="kyiv">Київ</option>
                            <option value="lviv">Львів</option>
                            <option value="odesa">Одеса</option>
                            <option value="kropyvnytskyi">Кропивницький</option>
                            <option value="сherkasy">Черкаси</option>
                            <option value="mykolayiv">Миколаїв</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>3. Додатково</legend>
                    <div class="form-group">
                        <label for="comment">Коментар до замовлення:</label>
                        <textarea id="comment" name="comment" rows="4" placeholder="Ваші побажання до замовлення..."></textarea>
                    </div>
                    <div class="form-checkbox">
                        <input type="checkbox" id="agreement" name="agreement" required />
                        <label for="agreement">Я погоджуюсь з правилами магазину</label>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-primary">Підтвердити замовлення</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Практика Форм. Всі права захищено.</p>
    </footer>
</body>
</html>
