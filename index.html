<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформлення замовлення - TechShop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc; 
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 40px 20px;
            align-items: center;
        }


        .checkout-container {
            width: 100%;
            max-width: 600px;
        }

        .checkout-container h2 {
            margin-bottom: 20px;
            color: #1e293b;
            text-align: center;
        }

        .checkout-form {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        fieldset {
            border: 1px solid #e5e7eb;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 6px;
        }

        legend {
            font-weight: bold;
            color: #1e293b;
            padding: 0 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.2rem;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #475569;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.6rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
        }


        .form-radio, .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.8rem;
            cursor: pointer;
        }

        .form-radio input, .form-checkbox input {
            width: auto;
            cursor: pointer;
        }


        .form-group input:invalid:focus,
        .form-group textarea:invalid:focus,
        .form-group select:invalid:focus {
            border-color: #ef4444;
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }


        .form-group input:valid:not(:placeholder-shown),
        .form-group textarea:valid:not(:placeholder-shown) {
            border-color: #10b981; 
        }


        .btn-primary {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        footer {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            text-align: center;
        }


        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .checkout-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Мій Логотип</h1>
        <nav>
            <a href="index.html">Головна</a>
            <a href="#">Про нас</a>
            <a href="checkout.html">Оформлення замовлення</a>
        </nav>
    </header>

    <main>
        <div class="checkout-container">
            <h2>Оформлення замовлення</h2>
            
            <form action="#" method="POST" class="checkout-form">
                <fieldset>
                    <legend>1. Особисті дані</legend>
                    
                    <div class="form-group">
                        <label for="fullName">ПІБ:</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            required
                            placeholder="Іванов Іван Іванович"
                        />
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="example@mail.com" />
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            pattern="[\+]\d{2}\d{10}"
                            placeholder="+380991234567"
                            required
                            title="Формат: +380XXXXXXXXX"
                        />
                    </div>
                </fieldset>

                <fieldset>
                    <legend>2. Спосіб доставки</legend>
                    
                    <div class="form-radio">
                        <input
                            type="radio"
                            id="deliveryNova"
                            name="delivery"
                            value="nova_poshta"
                            checked
                        />
                        <label for="deliveryNova">Нова Пошта</label>
                    </div>
                    
                    <div class="form-radio">
                        <input
                            type="radio"
                            id="deliveryCourier"
                            name="delivery"
                            value="courier"
                        />
                        <label for="deliveryCourier">Кур'єр за адресою</label>
                    </div>

                    <div class="form-group">
                        <label for="city">Місто:</label>
                        <select id="city" name="city">
                            <option value="kyiv">Київ</option>
                            <option value="lviv">Львів</option>
                            <option value="odesa">Одеса</option>
                            <option value="kropyvnytskyi">Кропивницький</option>
                            <option value="сherkasy">Черкаси</option>
                            <option value="mykolayiv">Миколаїв</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>3. Додатково</legend>
                    
                    <div class="form-group">
                        <label for="comment">Коментар до замовлення:</label>
                        <textarea id="comment" name="comment" rows="4" placeholder="Ваші побажання до замовлення..."></textarea>
                    </div>
                    
                    <div class="form-checkbox">
                        <input type="checkbox" id="agreement" name="agreement" required />
                        <label for="agreement">Я погоджуюсь з правилами магазину</label>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-primary">Підтвердити замовлення</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Практика Форм. Всі права захищено.</p>
    </footer>
</body>
</html>
