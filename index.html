<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Логотип - CSS Grid & Media Queries</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc; 
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        main {
            display: flex;
            flex: 1;
            padding: 20px 40px;
            gap: 30px;
        }

        .sidebar {
            width: 250px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .content-area {
            flex: 1;
        }

        /* --- ЗМІНИ ДЛЯ GRID --- */
        .cards-container {
            display: grid;
            /* Створюємо 3 колонки однакової ширини за замовчуванням */
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            /* Прибираємо фіксовану ширину, тепер картка займає всю клітинку гріда */
            font-weight: bold;
            color: #1e293b;
        }

        footer {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            text-align: center;
        }

        /* --- МЕДІАЗАПИТИ (Media Queries) --- */

        /* Для планшетів (до 1024px) */
        @media (max-width: 1024px) {
            .cards-container {
                grid-template-columns: repeat(2, 1fr); /* 2 колонки */
            }
        }

        /* Для мобільних пристроїв (до 768px) */
        @media (max-width: 768px) {
            main {
                flex-direction: column; /* Сайдбар стає над контентом */
            }

            .sidebar {
                width: 100%; /* Сайдбар на всю ширину */
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .cards-container {
                grid-template-columns: 1fr; /* 1 колонка (картки одна під одною) */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Мій Логотип</h1>
        <nav>
            <a href="#">Головна</a>
            <a href="#">Про нас</a>
            <a href="#">Контакти</a>
        </nav>
    </header>

    <main>
        <aside class="sidebar">
            <h2>Меню</h2>
            
        </aside>

        <section class="content-area">
            <h1>Лабораторна №5: Grid Layout</h1>
            
            
            <div class="cards-container">
                <article class="card">Картка 1</article>
                <article class="card">Картка 2</article>
                <article class="card">Картка 3</article>
                <article class="card">Картка 4</article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Практика Grid. Всі права захищено.</p>
    </footer>
</body>
</html>
